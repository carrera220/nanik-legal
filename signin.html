<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6762894314">
<title>Get started with Nanik</title>
<meta name="description" content="Get started with Nanik. Sign in with Google, Apple, or email to create bedtime stories in your voice.">
<link rel="canonical" href="https://nanik.app/signin.html">
<link rel="icon" type="image/png" sizes="64x64" href="images/favicon-64.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=20260910a">

<meta property="og:description" content="Sign in with Google, Apple, or email to create bedtime stories in your voice.">
<meta property="og:image" content="https://nanik.app/images/og-share.png?v=20260924b">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Get started with Nanik">
<meta name="twitter:image" content="https://nanik.app/images/og-share.png?v=20260924b">
</head>
<body class="signin-page" data-i18n-page-title="signin.pageTitle">
<header class="site signin-header">
  <div class="nav-shell">
    <a class="brand" href="/">Nanik</a>
    <a class="signin-back" href="/" data-i18n="signin.back">Back to Nanik</a>
    <div id="site-lang-slot" class="site-lang-slot"></div>
  </div>
</header>
<main class="signin-main">
  <section class="signin-layout" aria-labelledby="signin-title">
    <div class="signin-form-col">
      <div class="signin-card" id="signin-card">
        <h1 id="signin-title" data-i18n="signin.title">Get started with Nanik</h1>
        <p class="signin-lead" id="signin-lead" data-i18n="signin.lead">Create your account to make bedtime stories in your voice.</p>
        <p class="signin-prompt" id="signin-prompt" hidden></p>
        <p class="signin-status" id="signin-status" hidden></p>

        <div class="signin-guest" id="signin-guest">
          <div class="signin-oauth">
            <button type="button" class="signup-provider signup-provider-google" data-signin-provider="google">
              <span class="signup-provider-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
              </span>
              <span class="signup-provider-label" data-i18n="signin.google">Continue with Google</span>
            </button>
            <button type="button" class="signup-provider signup-provider-apple" data-signin-provider="apple">
              <span class="signup-provider-icon" aria-hidden="true">
                <svg viewBox="0 0 384 512" width="16" height="18"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
              </span>
              <span class="signup-provider-label" data-i18n="signin.apple">Continue with Apple</span>
            </button>
          </div>

          <div class="signin-or" role="separator">
            <span data-i18n="signin.or">or</span>
          </div>

          <form class="signin-email" id="signin-email-form" novalidate>
            <label class="signin-field">
              <span data-i18n="signin.email">Email</span>
              <input id="signin-email" type="email" name="email" autocomplete="email" inputmode="email" required data-i18n-placeholder="signin.emailPh" placeholder="you@email.com">
            </label>
            <label class="signin-field">
              <span data-i18n="signin.password">Password</span>
              <input id="signin-password" type="password" name="password" autocomplete="current-password" minlength="6" required data-i18n-placeholder="signin.passwordPh" placeholder="At least 6 characters">
            </label>
            <button type="submit" class="signin-continue" id="signin-continue" data-i18n="signin.continue">Continue</button>
            <button type="button" class="signin-magic" id="signin-magic" data-i18n="signin.magic">Sign in with email link</button>
          </form>
        </div>

        <div class="signin-signed" id="signin-signed" hidden>
          <a class="signup-provider signup-provider-store" href="https://apps.apple.com/app/id6762894314">
            <span class="signup-provider-label" data-i18n="signin.appStore">Get the iOS app</span>
          </a>
          <button type="button" class="signup-signout" id="signin-signout" data-i18n="signin.signOut">Sign out</button>
        </div>
      </div>
    </div>
    <aside class="signin-visual" aria-hidden="true">
      <img id="signin-side-img" src="images/signin-side.jpg" alt="" width="960" height="1200">
    </aside>
  </section>
</main>
<script src="nanik-api-config.js?v=20260909d"></script>
<script src="nanik-draft.js?v=20260910aq"></script>
<script src="site-nav.js?v=20260729u" defer></script>
<script src="geo-lang.js?v=20260920geo1" defer></script>
<script src="i18n.js?v=20260920geo1" defer></script>
<script src="signin.js?v=20260924gacct" defer></script>
</body>
</html>
