<main>
  <section class="hero bf-hero" aria-labelledby="bf-h1">
    <div>
      <h1 id="bf-h1" data-i18n="sf.h1" data-i18n-html>Turn big feelings into a story <strong>they can understand</strong></h1>
    </div>

    <form class="bf-composer" id="bf-form" data-bf-kind="emotional_support" novalidate>
      <label class="bf-visually-hidden" for="bf-text" data-i18n="sf.textLabel">Describe what your child is feeling</label>
      <div class="bf-box">
        <div class="bf-picked" data-bf-picked hidden></div>
        <textarea id="bf-text" class="bf-text" rows="3" maxlength="600" data-i18n-placeholder="sf.placeholder" placeholder="Tell us in your own words, e.g. “He gets upset when his sister plays with his toys.”"></textarea>
      </div>

      <div class="bf-chips bf-chips--wrap" role="group" aria-label="Common big feelings">
        <button type="button" class="bf-chip" data-bf-chip="Feeling angry" aria-pressed="false"><span aria-hidden="true">😠</span> <span data-i18n="sf.chip.angry">Feeling angry</span></button>
        <button type="button" class="bf-chip" data-bf-chip="Feeling sad" aria-pressed="false"><span aria-hidden="true">😢</span> <span data-i18n="sf.chip.sad">Feeling sad</span></button>
        <button type="button" class="bf-chip" data-bf-chip="Jealousy" aria-pressed="false"><span aria-hidden="true">💚</span> <span data-i18n="sf.chip.jealous">Jealousy</span></button>
        <button type="button" class="bf-chip" data-bf-chip="Friendship trouble" aria-pressed="false"><span aria-hidden="true">🤝</span> <span data-i18n="sf.chip.friends">Friendship trouble</span></button>
        <button type="button" class="bf-chip" data-bf-chip="Feeling worried" aria-pressed="false"><span aria-hidden="true">😟</span> <span data-i18n="sf.chip.worried">Feeling worried</span></button>
      </div>

      <div class="bf-field">
        <span class="bf-label" id="bf-age-label" data-i18n="bf.age">Select age</span>
        <div class="bf-ages" role="radiogroup" aria-labelledby="bf-age-label">
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="2">2</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="3">3</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="4">4</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="5">5</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="6">6</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="7">7</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="8">8</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="9">9</button>
          <button type="button" class="bf-age" role="radio" aria-checked="false" data-bf-age="10">10+</button>
        </div>
      </div>

      <div class="bf-field">
        <label class="bf-visually-hidden" for="bf-name" data-i18n="bf.namePlaceholder">Your child's name (optional)</label>
        <input id="bf-name" class="bf-input" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="bf.namePlaceholder" placeholder="Your child's name (optional)">
      </div>

      <div class="bf-field">
        <label class="bf-label" for="bf-lang" data-i18n="bf.lang">Story language</label>
        <select id="bf-lang" class="bf-input bf-select"></select>
      </div>

      <button type="submit" class="bf-submit" id="bf-submit">Create story</button>
    </form>
  </section>

  <section class="bf-more" aria-labelledby="bf-more-title">
    <h2 id="bf-more-title" class="bf-more-title" data-i18n="bf.moreTitle">More you can do with Nanik app</h2>
    <div class="use-cases" data-use-cases>
      <div class="use-cases-carousel">
        <button type="button" class="use-cases-arrow" data-uc-prev disabled aria-label="Previous feature">&#8249;</button>

          </figure>
          <figure class="bf-feature" role="listitem">
            <img src="images/feature-supports.jpg" width="473" height="1024" alt="Gently support their day: weave today's feelings into the story" loading="lazy" decoding="async">
          </figure>
          <figure class="bf-feature" role="listitem">
            <img src="images/feature-hero.jpg" width="473" height="1024" alt="Watch their toys come alive: a photo of a toy becomes an illustrated hero" loading="lazy" decoding="async">
          </figure>
          <figure class="bf-feature" role="listitem">
            <img src="images/feature-world.jpg" width="473" height="1024" alt="Build any world you imagine: set the perfect scene for their adventure" loading="lazy" decoding="async">
          </figure>
          <figure class="bf-feature" role="listitem">
            <img src="images/feature-library.jpg" width="473" height="1024" alt="A library of your own: save and revisit your best stories anytime" loading="lazy" decoding="async">
          </figure>
          <figure class="bf-feature" role="listitem">
            <img src="images/feature-series.jpg" width="473" height="1024" alt="Turn stories into a series: keep the same hero for the next chapter" loading="lazy" decoding="async">
          </figure>
        </div>
        <button type="button" class="use-cases-arrow" data-uc-next aria-label="Next feature">&#8250;</button>
      </div>
      <div class="use-cases-dots" data-uc-dots aria-hidden="true"></div>
