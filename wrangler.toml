# Cloudflare Workers static deploy for nanik-legal-dev.gor-kroyan.workers.dev
# Deploy from this repo: npx wrangler deploy

name = "nanik-legal-dev"
main = "cf-static-worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Intercept first so secret paths cannot be served even if present in the asset store.
run_worker_first = true
