# Cloudflare Workers static deploy for nanik-legal-dev.gor-kroyan.workers.dev
# Deploy: npx wrangler deploy
# Or push to `dev` with the GitHub Action (needs CLOUDFLARE_API_TOKEN secret).

name = "nanik-legal-dev"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Keep the Worker bundle tiny — only static hosting.
main = "cf-static-worker.js"
